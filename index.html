<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FitTrack - Your personal fitness tracker for workouts, progress, and nutrition" />
    <meta name="theme-color" content="#6366f1" />
    <title>FitTrack - Fitness Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const route = params.get('p');
        if (!route) return;

        const base = '%BASE_URL%'.replace(/\\/$/, '');
        const normalizedRoute = route.startsWith('/') ? route : `/${route}`;
        window.history.replaceState(null, '', `${base}${normalizedRoute}`);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
